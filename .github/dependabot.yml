version: 2
updates:
  # 扫描 apps/<应用>/<版本>/docker-compose.yml 的镜像版本
  # 注意:directories 的 glob 只支持单段 `*`,不支持 `**`(会报
  # dependency_file_not_found "/apps/** not found");两层 * 恰好匹配版本目录,
  # 新增应用或版本目录被 workflow 重命名后依然自动覆盖
  - package-ecosystem: "docker-compose"
    directories:
      - "/apps/*/*"
    schedule:
      interval: "daily"
    # 禁止 rebase:PR 合并后 workflow 会在主分支重命名版本目录,rebase 会与之冲突
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(app)"
    labels:
      - "dependencies"
