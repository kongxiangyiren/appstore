name: Dependabot app version sync
permissions:
  contents: write
  pull-requests: write
on:
  pull_request_target:
    types: [opened, reopened, closed]

jobs:
  # Dependabot 分支(dependabot/**)不允许外部推送提交,因此无法像 Renovate
  # 那样先把目录重命名提交推到 PR 分支再合并。改为:PR 创建后直接自动合并,
  # 合并完成后再在主分支上同步版本目录并推送重命名提交。
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/')
    steps:
      - name: Merge or enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          # job 内没有 checkout,gh 需要显式指定仓库,否则会尝试从本地
          # git remote 推断并报 "fatal: not a git repository"
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Handling PR #$PR_NUMBER"

          # Try each merge method in order; fall back to enabling auto-merge
          # if required checks are still pending
          # (--delete-branch 需要本地 git 仓库,Dependabot 合并后会自行删分支,故省略)
          for method in squash merge rebase; do
            if gh pr merge "$PR_NUMBER" --$method; then
              echo "PR #$PR_NUMBER merged with --$method"
              exit 0
            fi
          done

          if gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "Auto-merge enabled for PR #$PR_NUMBER (will merge when checks pass)"
          else
            echo "::warning::Could not merge PR #$PR_NUMBER (it may have conflicts or unmet requirements)"
          fi

  rename-version-dir:
    name: Sync app version dir after merge
    runs-on: ubuntu-latest
    # 注意:pull_request_target 的 closed 事件 payload 中 pull_request.merged
    # 字段可能为 false(即使 PR 实际已合并,尤其是通过 API 合并时)。
    # 因此这里只判断 action == 'closed',是否真正合并交给后续步骤查 API 确认。
    if: >-
      github.event.action == 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      # 通过 REST API 确认 PR 确实被合并(而非关闭),并获取实际变更文件列表。
      # pull_request_target 的 webhook payload 不包含 files,merged 也可能为 false。
      - name: Check merged & get changed files
        id: changed-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state')
          merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.merged')
          echo "state=$state merged=$merged"

          if [ "$state" != "closed" ] || [ "$merged" != "true" ]; then
            echo "PR #$PR_NUMBER was not merged (state=$state, merged=$merged); skipping"
            exit 0
          fi

          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed-files.txt
          cat changed-files.txt

      - name: Run dependabot-app-version.sh on merged files
        run: |
          while read -r file; do
            case "$file" in
              *"docker-compose.yml")
                app_name=$(echo "$file" | cut -d'/' -f 2)
                old_version=$(echo "$file" | cut -d'/' -f 3)
                chmod +x .github/workflows/dependabot-app-version.sh
                .github/workflows/dependabot-app-version.sh "$app_name" "$old_version"
                ;;
            esac
          done < changed-files.txt

      - name: Commit & Push Changes
        run: |
          while read -r file; do
            case "$file" in
              *"docker-compose.yml")
                app_name=$(echo "$file" | cut -d'/' -f 2)
                git add "apps/$app_name"
                ;;
            esac
          done < changed-files.txt

          if git diff --cached --quiet; then
            echo "No version dir renames to commit"
          else
            git commit -m "Update app version [skip ci]" --no-verify
            git push
          fi

