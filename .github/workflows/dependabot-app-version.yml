name: Dependabot app version sync
permissions:
  contents: write
  pull-requests: write
on:
  push:
    branches: [ 'dependabot/*' ]
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'Manually trigger Dependabot'
        default: ''
jobs:
  update-app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      - name: Get list of updated files by the last commit in this branch separated by space
        id: updated-files
        run: |
          echo "::set-output name=files::$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | tr '\n' ' ')"

      - name: Run dependabot-app-version.sh on merged files
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          for file in "${files[@]}"; do
            if [[ $file == *"docker-compose.yml"* ]]; then
              app_name=$(echo $file | cut -d'/' -f 2)
              old_version=$(echo $file | cut -d'/' -f 3)
              chmod +x .github/workflows/dependabot-app-version.sh
              .github/workflows/dependabot-app-version.sh $app_name $old_version
            fi
          done

      - name: Commit & Push Changes
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          for file in "${files[@]}"; do
            if [[ $file == *"docker-compose.yml"* ]]; then
              app_name=$(echo $file | cut -d'/' -f 2)
              git add "apps/$app_name/*" && git commit -m "Update app version [skip ci]" --no-verify && git push || true
            fi
          done

      - name: Auto-merge Dependabot PR
        if: startsWith(github.ref, 'refs/heads/dependabot/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.head_ref || github.ref_name }}"

          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            echo "No open PR found for branch '$branch', skipping auto-merge"
            exit 0
          fi

          echo "Merging PR #$pr_number (branch: $branch)"

          # Try each merge method in order; fall back to enabling auto-merge if checks are still pending
          for method in squash merge rebase; do
            if gh pr merge "$pr_number" --$method --delete-branch; then
              echo "PR #$pr_number merged with --$method"
              exit 0
            fi
          done

          if gh pr merge "$pr_number" --auto --squash; then
            echo "Auto-merge enabled for PR #$pr_number (will merge when checks pass)"
          else
            echo "::warning::Could not merge PR #$pr_number (it may have conflicts or unmet requirements)"
          fi
