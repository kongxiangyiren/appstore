  description:
    en: Magpie is a local AI gateway that puts any model behind any coding agent, translating between the OpenAI, Anthropic and Gemini APIs and moving on to the next account when a quota runs out.
    es-es: Magpie es una puerta de enlace de IA local que pone cualquier modelo detrás de cualquier agente de código, traduciendo entre las API de OpenAI, Anthropic y Gemini y pasando a la siguiente cuenta cuando se agota la cuota.
    zh: Magpie 是一个本地 AI 网关，把 Claude Code、Codex、Gemini CLI 等编码代理统一接到任意模型供应商，并在额度用尽时自动切换到下一个账号。
    zh-Hant: Magpie 是一個本地 AI 閘道，把 Claude Code、Codex、Gemini CLI 等編碼代理統一接到任意模型供應商，並在額度用盡時自動切換到下一個帳號。
    ja: Magpie は、Claude Code や Codex、Gemini CLI などのコーディングエージェントを任意のモデルプロバイダーに接続するローカル AI ゲートウェイです。クォータを使い切ると次のアカウントへ自動的に切り替えます。
    ms: Magpie ialah gerbang AI tempatan yang menyambungkan Claude Code, Codex, Gemini CLI dan ejen pengekodan lain kepada mana-mana pembekal model, dan bertukar ke akaun seterusnya apabila kuota habis.
    pt-br: Magpie é um gateway de IA local que conecta Claude Code, Codex, Gemini CLI e outros agentes de código a qualquer provedor de modelos, passando para a próxima conta quando a cota acaba.
    ru: Magpie — локальный AI-шлюз, который подключает Claude Code, Codex, Gemini CLI и других агентов к любому поставщику моделей и переключается на следующую учётную запись, когда заканчивается квота.
    ko: Magpie는 Claude Code, Codex, Gemini CLI 등 코딩 에이전트를 원하는 모델 공급자에 연결하는 로컬 AI 게이트웨이로, 할당량이 소진되면 다음 계정으로 자동 전환합니다.
    tr: Magpie, herhangi bir modeli herhangi bir kodlama ajanının arkasına koyan yerel bir yapay zeka ağ geçididir; OpenAI, Anthropic ve Gemini API'leri arasında çeviri yapar ve kota tükendiğinde bir sonraki hesaba geçer.
