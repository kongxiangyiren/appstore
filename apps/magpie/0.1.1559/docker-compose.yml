services:
  magpie:
    image: ghcr.io/yetone/magpie:0.1.1565
    container_name: ${CONTAINER_NAME}
    restart: always
    command:
      - web
      - --addr
      - 0.0.0.0:3430
      - --no-open
    ports:
      - ${PANEL_APP_PORT_HTTP}:3430
      - ${PANEL_APP_PORT_GATEWAY}:3425
    environment:
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY}
      MAGPIE_PUBLIC_URL: ${MAGPIE_PUBLIC_URL}
    volumes:
      - ./data:/config
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
